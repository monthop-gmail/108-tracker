name: Remove legacy workers (one-off)

# ใช้ครั้งเดียวหลังย้ายมา 108-tracker:
# 1) ซิงก์ข้อมูลจากฐานข้อมูลของแอปเดิมอีกรอบสุดท้าย
# 2) ลบ Worker เดิม health-tracker, bill-tracker, maintenance-tracker
#    (ฐานข้อมูล D1 เดิมไม่ถูกลบ — เก็บไว้เป็นสำรอง)

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/ensure-d1.mjs

      - name: Final sync from old databases
        run: node scripts/import-legacy.mjs

      - name: Row counts in 108-tracker
        run: |
          npx wrangler d1 execute 108-tracker --remote --command "SELECT
            (SELECT COUNT(*) FROM health_entries) AS health_entries, (SELECT COUNT(*) FROM health_meds) AS meds,
            (SELECT COUNT(*) FROM health_appts) AS appts, (SELECT COUNT(*) FROM bills_items) AS bills,
            (SELECT COUNT(*) FROM bills_payments) AS payments, (SELECT COUNT(*) FROM maint_assets) AS assets,
            (SELECT COUNT(*) FROM maint_tasks) AS tasks, (SELECT COUNT(*) FROM maint_logs) AS logs,
            (SELECT group_concat(key) FROM settings) AS settings"

      - name: Delete old Workers (run outside the project so the config name cannot be used)
        working-directory: /tmp
        run: |
          fail=0
          for n in health-tracker bill-tracker maintenance-tracker; do
            echo "== $n"
            "$GITHUB_WORKSPACE/node_modules/.bin/wrangler" delete "$n" || fail=1
          done
          exit $fail

      - name: Confirm 108-tracker is still there
        run: npx wrangler deployments list --name 108-tracker | head -20
